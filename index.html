<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brandscape — AI-Powered Marketing Automation</title>
    <meta name="description" content="End-to-end AI automation for marketing agencies. From discovery to delivery — research, strategy, scripts, and content generation, all in one platform." />
    <link rel="canonical" href="https://brandscape.media/" />
    <meta name="theme-color" content="#000000" />

    <!--
      Link previews. This is a client-rendered SPA on a static host, and the
      unfurlers (LinkedIn, Slack, X, iMessage) do NOT run JavaScript — they read
      this file and stop. So these tags are necessarily site-wide rather than
      per-route: every URL previews as the homepage card. Per-route cards would
      need prerendering at build time.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brandscape" />
    <meta property="og:url" content="https://brandscape.media/" />
    <meta property="og:title" content="Brandscape — the whole content pipeline, automated" />
    <meta property="og:description" content="Discovery, research, ideation, scripts, shoot plan and finished creatives. Your agency supervises; the AI produces." />
    <meta property="og:image" content="https://brandscape.media/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brandscape" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brandscape — the whole content pipeline, automated" />
    <meta name="twitter:description" content="Discovery, research, ideation, scripts, shoot plan and finished creatives. Your agency supervises; the AI produces." />
    <meta name="twitter:image" content="https://brandscape.media/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Restore the URL that public/404.html encoded into the query string
      // (GitHub Pages SPA fallback — rafgraph/spa-github-pages).
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body class="bg-brand-black text-brand-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
